<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aan tafel! Zorg op maat</title><style>
:root{font-family:system-ui,Arial;color:#173b38;background:#f3f8f5}*{box-sizing:border-box}body{margin:0}header{background:#146e63;color:white;padding:24px max(20px,calc((100% - 1040px)/2))}h1{margin:0;font-size:2rem}header p{margin:6px 0}main{max-width:1040px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce9e3;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 3px 14px #173b3810}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.plan{background:#e7f4ee;border-left:5px solid #168676;padding:16px;border-radius:12px;line-height:1.6}.foodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.food{border:2px solid #d5e5dd;background:white;border-radius:14px;padding:12px;min-height:108px;cursor:pointer;font:inherit}.food span{display:block;font-size:2.1rem}.food.chosen{background:#e0f5ea;border-color:#087a60}.plate{border:12px solid #e1e7e5;box-shadow:inset 0 0 0 3px #b8cbc5;background:#fff;border-radius:50%;width:min(290px,100%);aspect-ratio:1;margin:12px auto;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;gap:10px;padding:35px}.plate span{font-size:2.5rem}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button{cursor:pointer}button.nav{border:0;background:#146e63;color:white;padding:12px 20px;border-radius:10px;font-size:1rem;font-weight:700}button.back{background:white;color:#146e63;border:2px solid #146e63}.choice{display:block;width:100%;text-align:left;background:white;border:2px solid #d9e7e1;padding:14px;margin:9px 0;border-radius:12px;font:inherit}.choice.chosen{border-color:#087a60;background:#e0f5ea}.feedback{border-left:5px solid #168676;background:#edf9f0;padding:12px;margin:10px 0;border-radius:8px}.feedback.bad{border-color:#bd593f;background:#fff0ea}.small{color:#51635e}.progress{height:9px;background:#d9e9e2;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#168676}button:focus-visible{outline:3px solid #d18e1b;outline-offset:2px}@media(max-width:700px){.layout{grid-template-columns:1fr}.foodgrid{grid-template-columns:repeat(2,1fr)}h1{font-size:1.6rem}}</style>
<header><h1>🍽️ Aan tafel! – Zorg op maat</h1><p>Een interactieve oefening voor zorgkundigen • Voeding en vocht</p></header><main id="app"></main><script>
const cases=[
{name:"Maria",age:82,emoji:"👵",story:"Maria heeft slikproblemen. Volgens het zorgplan krijgt zij glad gemixte voeding zonder stukjes. Haar dranken worden ingedikt volgens de afgesproken consistentie.",foods:[["🥔","Gladde aardappelpuree",1],["🥕","Glad gemixte wortelen",1],["🍗","Glad gemixte kip met saus",1],["🥕","Rauwe wortelen",0],["🥨","Droge crackers",0],["🥤","Gewoon dun water",0]],steps:[{title:"Voorbereiding",q:"Hoe help je Maria veilig aan tafel?",opts:[["Maria rechtop laten zitten",1,"Een rechte houding helpt bij veilig slikken."],["De afgesproken consistentie controleren",1,"Volg altijd het zorgplan."],["Maria liggend laten eten",0,"Liggend eten is niet veilig."]]},{title:"Tijdens de maaltijd",q:"Maria begint plots te hoesten bij het eten. Wat doe je?",opts:[["Stoppen met eten geven en de situatie beoordelen",1,"Stop de maaltijd en kijk of Maria goed kan ademen en hoesten."],["Snel water geven om door te slikken",0,"Geef niet zomaar water bij slikproblemen."],["Verder eten geven",0,"Ga niet verder zolang de veiligheid niet duidelijk is."]]},{title:"Afronden",q:"Wat doe je na de maaltijd?",opts:[["De voedsel- en vochtinname observeren en rapporteren",1,"Zo kan het team de voeding opvolgen."],["Het hoesten melden",1,"Meld problemen tijdens het eten."],["Niets noteren, want de maaltijd is voorbij",0,"Belangrijke observaties moet je doorgeven."]]}]},
{name:"Jan",age:76,emoji:"👴",story:"Jan heeft diabetes. Hij eet volgens de afspraken in zijn zorgplan. Hij heeft een gewone consistentie en wil graag zelfstandig eten.",foods:[["🥔","Aardappelen",1],["🥦","Groenten",1],["🐟","Vis",1],["🍭","Een grote zak snoep als maaltijd",0],["🥤","Suikerrijke frisdrank",0],["💧","Water",1]],steps:[{title:"Voorbereiding",q:"Wat controleer je?",opts:[["De voedingsafspraken in het zorgplan",1,"De afspraken verschillen per persoon."],["Of Jan zelf kan eten",1,"Stimuleer zelfstandigheid."],["Iedereen met diabetes dezelfde maaltijd geven",0,"Voeding is persoonlijk."]]},{title:"Tijdens de maaltijd",q:"Jan wil zijn maaltijd zelf eten. Wat doe je?",opts:[["Hem zelf laten eten als dat veilig kan",1,"Zelfstandigheid is belangrijk."],["Alles zonder overleg overnemen",0,"Neem niet onnodig over."],["Vragen of hij hulp nodig heeft",1,"Overleg met de zorgvrager."]]},{title:"Afronden",q:"Wat rapporteer je?",opts:[["Opvallend weinig eten",1,"Een lage inname kan belangrijk zijn."],["Bijzonderheden volgens de afspraken",1,"Rapporteer wat relevant is."],["Nooit iets, want Jan heeft diabetes",0,"Observeer en rapporteer waar nodig."]]}]},
{name:"Louise",age:89,emoji:"👵",story:"Louise eet de laatste dagen weinig. Ze is snel moe. Het zorgteam volgt haar voedsel- en vochtinname op. Ze mag gewone voeding eten.",foods:[["🥣","Kleine portie soep",1],["🥔","Kleine aantrekkelijke warme maaltijd",1],["🍮","Dessert volgens haar voorkeur",1],["🍽️","Een veel te groot bord",0],["💧","Drank volgens haar voorkeur",1],["🥨","Alleen droge crackers",0]],steps:[{title:"Voorbereiding",q:"Hoe maak je het eten aangenaam?",opts:[["Vragen wat Louise graag eet",1,"Voorkeuren kunnen helpen."],["Een rustige omgeving voorzien",1,"Rust helpt bij de maaltijd."],["Zonder overleg een groot bord vullen",0,"Een grote portie kan ontmoedigen."]]},{title:"Tijdens de maaltijd",q:"Louise zegt dat ze moe is. Wat doe je?",opts:[["Rustig luisteren en zo nodig pauzeren",1,"Respecteer haar tempo."],["Haar dwingen alles op te eten",0,"Dwingen is niet gepast."],["Nagaan of ze hulp wil",1,"Bied hulp op maat."]]},{title:"Afronden",q:"Wat geef je door?",opts:[["Hoeveel Louise ongeveer at en dronk",1,"De inname wordt opgevolgd."],["Dat ze snel moe werd",1,"Dat is een relevante observatie."],["Niets, omdat weinig eten normaal is op haar leeftijd",0,"Weinig eten verdient aandacht."]]}]},
{name:"Albert",age:84,emoji:"👴",story:"Albert gebruikt een rolstoel. Hij heeft minder kracht in zijn handen. Hij kan gedeeltelijk zelfstandig eten met geschikte hulpmiddelen.",foods:[["🥔","Aardappelen",1],["🥦","Groenten",1],["🍗","Vlees in hanteerbare stukjes",1],["💧","Water",1],["🍬","Alleen snoep",0],["🥨","Alleen crackers",0]],steps:[{title:"Voorbereiding",q:"Wat helpt Albert?",opts:[["Een stabiele zithouding en goede tafelhoogte",1,"Een goede houding is belangrijk."],["Aangepast bestek aanbieden indien nodig",1,"Hulpmiddelen kunnen zelfstandigheid ondersteunen."],["De rolstoel laten wegrollen",0,"Zorg voor een veilige, stabiele positie."]]},{title:"Tijdens de maaltijd",q:"Albert eet traag. Wat doe je?",opts:[["Voldoende tijd geven",1,"Respecteer zijn tempo."],["Vragen welke hulp hij wil",1,"Stem hulp af op zijn wensen."],["Zonder overleg alles overnemen",0,"Stimuleer zelfstandigheid."]]},{title:"Afronden",q:"Wat is belangrijk?",opts:[["Nagaan of Albert voldoende kon eten",1,"Observeer de inname."],["Melden als een hulpmiddel niet goed werkt",1,"Zo kan de zorg worden aangepast."],["Hulpmiddelen vuil laten liggen",0,"Reinig materiaal volgens afspraak."]]}]},
{name:"Rosa",age:87,emoji:"👵",story:"Rosa heeft dementie. Ze raakt soms afgeleid tijdens het eten. Ze eet gewone voeding en heeft baat bij rust en duidelijke aanwijzingen.",foods:[["🥔","Aardappelen",1],["🥕","Groenten",1],["🐟","Vis",1],["💧","Water",1],["🍭","Alleen snoep",0],["🥨","Alleen crackers",0]],steps:[{title:"Voorbereiding",q:"Hoe bereid je de maaltijd voor?",opts:[["Een rustige plek kiezen",1,"Minder prikkels kan helpen."],["Duidelijk vertellen wat er gaat gebeuren",1,"Eenvoudige uitleg geeft houvast."],["Veel lawaai en afleiding voorzien",0,"Dat kan het eten moeilijker maken."]]},{title:"Tijdens de maaltijd",q:"Rosa stopt plots met eten en kijkt rond. Wat doe je?",opts:[["Rustig contact maken en aanmoedigen",1,"Een vriendelijke aanwijzing kan helpen."],["Haar opjagen",0,"Geef tijd en rust."],["Kijken of ze hulp nodig heeft",1,"Observeer en stem je hulp af."]]},{title:"Afronden",q:"Wat geef je door?",opts:[["Hoeveel Rosa gegeten en gedronken heeft",1,"Observeer de inname."],["Wat haar hielp om verder te eten",1,"Dit helpt het team."],["Niets, want afleiding hoort erbij",0,"Ook dit kan relevant zijn."]]}]}
];
let ci=-1,stage=0,answers={},chosen=[];const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function btn(t,fn,back=false){return '<button class="nav '+(back?'back':'')+'" onclick="'+fn+'">'+t+'</button>'}
function plan(c){return '<div class="plan"><strong>📋 Zorgplan: '+c.name+', '+c.age+' jaar</strong><p>'+esc(c.story)+'</p></div>'}
function begin(i){ci=i;stage=0;answers={};chosen=[];render()}
function toggle(i){chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i];render()}
function forward(){if(!chosen.length){alert("Kies eerst minstens één antwoord.");return}answers[stage]=[...chosen];stage++;chosen=[...(answers[stage]||[])];render();scrollTo(0,0)}
function back(){if(stage===0){ci=-1;render();return}stage--;chosen=[...(answers[stage]||[])];render();scrollTo(0,0)}
function render(){if(ci<0){app.innerHTML='<div class="card"><h2>Kies een zorgvrager</h2><p>Je oefent de maaltijd van begin tot einde. Je krijgt pas feedback na de volledige situatie.</p><div class="layout">'+cases.map((c,i)=>'<button class="choice" onclick="begin('+i+')"><span style="font-size:2rem">'+c.emoji+'</span><br><strong>'+c.name+' ('+c.age+' jaar)</strong><br>'+esc(c.story.split(".")[0])+'.</button>').join('')+'</div></div>';return}
const c=cases[ci];let h='<div class="card"><strong>Stap '+Math.min(stage+1,5)+' van 5 · '+c.name+'</strong><div class="progress"><div style="width:'+Math.min((stage+1)*20,100)+'%"></div></div></div>'+plan(c);
if(stage===0){h+='<div class="card"><h2>🥗 1. Stel de maaltijd samen</h2><p>Klik op alle voedingsmiddelen die geschikt zijn. De gekozen producten verschijnen op het bord.</p><div class="layout"><div class="foodgrid">'+c.foods.map((f,i)=>'<button class="food '+(chosen.includes(i)?'chosen':'')+'" aria-pressed="'+chosen.includes(i)+'" onclick="toggle('+i+')'"><span>'+f[0]+'</span>'+esc(f[1])+'</button>').join('')+'</div><div><h3 style="text-align:center">Jouw bord</h3><div class="plate">'+(chosen.length?chosen.map(i=>'<span title="'+esc(c.foods[i][1])+'">'+c.foods[i][0]+'</span>').join(''):'<span style="font-size:1rem;color:#7c928a">Nog leeg</span>')+'</div><p class="small" style="text-align:center">'+chosen.map(i=>esc(c.foods[i][1])).join(' · ')+'</p></div></div></div>'}
else if(stage<=3){let st=c.steps[stage-1];h+='<div class="card"><h2>'+['🪑 2. ','⚠️ 3. ','📝 4. '][stage-1]+st.title+'</h2><p>'+esc(st.q)+'</p><p class="small">Je mag meer dan één antwoord kiezen.</p>'+st.opts.map((o,i)=>'<button class="choice '+(chosen.includes(i)?'chosen':'')+'" aria-pressed="'+chosen.includes(i)+'" onclick="toggle('+i+')">'+(chosen.includes(i)?'☑':'☐')+' '+esc(o[0])+'</button>').join('')+'</div>'}
else{let groups=[{title:"Maaltijd",opts:c.foods.map(f=>[f[1],f[2],f[2]?"Dit past bij het zorgplan.":"Dit past niet bij het zorgplan."])},...c.steps];let score=0,total=0;h+='<div class="card"><h2>🎉 Situatie afgerond: jouw feedback</h2><p>Lees rustig wat goed ging en wat je nog kunt oefenen.</p>';let blocks=groups.map((g,k)=>{let items=g.opts.map((o,i)=>{let sel=(answers[k]||[]).includes(i),ok=sel===!!o[1];total++;if(ok)score++;return '<div class="feedback '+(ok?'':'bad')+'"><strong>'+(ok?'✓ Goed':'✕ Nog oefenen')+'</strong><p>'+esc(o[0])+'</p><p>'+(sel?'Je koos dit. ':'Je koos dit niet. ')+(ok?(o[1]?'Dat is juist. ':'Goed dat je dit niet koos. '):(o[1]?'Dit had je moeten kiezen. ':'Dit was geen goede keuze. '))+esc(o[2])+'</p></div>'}).join('');return '<h3>'+g.title+'</h3>'+items});h+='<div id="score"></div>'+blocks.join('')+btn('Opnieuw oefenen','begin('+ci+')')+' '+btn('Andere zorgvrager','begin(-1)')+'</div>';app.innerHTML=h.replace('<div id="score"></div>','<p><strong>'+score+' van '+total+' keuzes goed ('+Math.round(score/total*100)+'%)</strong></p>');return}
h+='<div class="actions">'+btn('← Terug', 'back()',true)+btn(stage===3?'Bekijk feedback →':'Volgende stap →','forward()')+'</div>';app.innerHTML=h}
render();
</script></html>
